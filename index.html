<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Игра 21</title>
</head>
<body>
  <h1>Игра «21» 🃏</h1>
  <p id="status">Входим через Telegram…</p>

  <script>
    async function start() {
      const status = document.getElementById("status");
      const tg = window.Telegram?.WebApp;

      if (!tg?.initData) {
        status.textContent = "Открой игру через кнопку в Telegram-боте.";
        return;
      }

      tg.ready();

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: tg.initData })
        });

        if (!response.ok) throw new Error("Сервер отклонил вход");

        const player = await response.json();
        status.textContent = `Привет, ${player.first_name}! Вход выполнен.`;
      } catch (error) {
        status.textContent = `Ошибка: ${error.message}`;
      }
    }

    start();
  </script>
</body>
</html>
