<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <title>Игра 21</title>

  <style>
    :root {
      --background: #091b16;
      --table: #103b2b;
      --border: rgba(255, 255, 255, .13);
      --text: #f5f5ed;
      --muted: #b7c9bd;
      --gold: #f2c66d;
      --green: #35b875;
      --red: #dc5353;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
      background: radial-gradient(
        circle at 50% 35%,
        #1b563d 0%,
        var(--table) 48%,
        var(--background) 100%
      );
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand {
      font-size: 23px;
      font-weight: 900;
    }

    .brand span {
      color: var(--gold);
    }

    .balance {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      color: var(--gold);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .message {
      min-height: 42px;
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
      text-align: center;
    }

    .message.error {
      color: #ffabab;
    }

    .hero,
    .panel {
      padding: 24px 18px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(12, 42, 30, .76);
      box-shadow: 0 14px 35px rgba(0, 0, 0, .15);
    }

    .hero {
      text-align: center;
    }

    .hero-icon {
      font-size: 50px;
    }

    .hero h1 {
      margin: 12px 0;
      color: var(--gold);
      font-size: 32px;
    }

    .hero p,
    .caption {
      color: var(--muted);
      line-height: 1.5;
    }

    .panel {
      margin-bottom: 16px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 17px;
    }

    .panel-title h2 {
      margin: 0;
      font-size: 18px;
    }

    .score,
    .stake-label {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(242, 198, 109, .14);
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
    }

    .stake-title {
      margin: 26px 0 12px;
      text-align: center;
      font-weight: 800;
    }

    .stake-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    button {
      min-height: 54px;
      padding: 12px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: #062015;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
    }

    button.secondary {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .10);
      color: var(--text);
    }

    .wide {
      display: block;
      width: 100%;
      margin-top: 12px;
    }

    .stake-button {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .10);
      color: white;
    }

    .stake-button.selected {
      border-color: var(--gold);
      background: var(--gold);
      color: #231b0c;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      min-height: 106px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 66px;
      height: 96px;
      border-radius: 10px;
      background: #fffdf7;
      color: #1e2420;
      box-shadow: 0 5px 12px rgba(0, 0, 0, .25);
      font-size: 28px;
      font-weight: 800;
    }

    .card.red {
      color: var(--red);
    }

    .card small {
      font-size: 27px;
      line-height: 1;
    }

    .card.back {
      border: 4px solid #f1eadb;
      background: repeating-linear-gradient(
        45deg,
        #235694 0,
        #235694 6px,
        #184579 6px,
        #184579 12px
      );
