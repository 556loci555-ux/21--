<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Игра 21</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px;
      background: #141414;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 48px;
      font-size: 32px;
    }

    #status {
      margin-top: 24px;
      font-size: 18px;
      line-height: 1.5;
      color: #ffffff;
    }
  </style>
</head>

<body>
  <h1>Игра «21» 🃏</h1>
  <p id="status">Загружаем профиль…</p>

  <script>
    async function start() {
      const status = document.getElementById("status");
      const tg = window.Telegram?.WebApp;

      if (!tg?.initData) {
        status.textContent = "Открой игру через кнопку Telegram-бота.";
        return;
      }

      tg.ready();

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: tg.initData })
        });

        if (!response.ok) {
          throw new Error(`Ошибка входа: ${response.status}`);
        }

        const player = await response.json();
        status.textContent = `Привет, ${player.first_name}! Вход выполнен.`;
      } catch (error) {
        status.textContent = error.message;
      }
    }

    start();
  </script>
</body>
</html>
